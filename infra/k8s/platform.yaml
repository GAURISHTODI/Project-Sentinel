apiVersion: v1
kind: Namespace
metadata:
  name: sentinel
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Default deny: nothing in the namespace talks to anything until a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sentinel
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The gateway accepts traffic only from inside the namespace, and reaches only the shop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: responder-ingress-and-shop-egress
  namespace: sentinel
spec:
  podSelector:
    matchLabels:
      app: responder
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: target-shop
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: responder
  namespace: sentinel
  labels:
    app: responder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responder
  template:
    metadata:
      labels:
        app: responder
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: responder
          image: sentinel/responder:1.0.0
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet:
              path: /_gw/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_gw/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-shop
  namespace: sentinel
  labels:
    app: target-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-shop
  template:
    metadata:
      labels:
        app: target-shop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: target-shop
          image: sentinel/target-shop:1.0.0
          env:
            - name: SHOP_VERSION
              value: v2
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-ingress-from-gateway-only
  namespace: sentinel
spec:
  podSelector:
    matchLabels:
      app: target-shop
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: responder
      ports:
        - port: 8080
          protocol: TCP
