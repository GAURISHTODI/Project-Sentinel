# Profiles: core (Kafka, Redis, Postgres), viz (Splunk, Prometheus, Grafana), k8s (T22).
# Never run everything at once on the 16 GB dev machine.
#   docker compose --profile core up -d
#   docker compose --profile core --profile viz up -d     # only when needed
# Profiles: `core` = data plane + target-shop (+ responder gateway, T8); `attack` = attack tools (T9).

name: sentinel

networks:
  # Platform data plane (Kafka, Redis, Postgres) plus the services that use it. INTERNAL: no internet
  # access, and not reachable from the attack tools.
  backend:
    name: sentinel-backend
    internal: true
  # Exists only so a few services can publish ports on 127.0.0.1 (Docker cannot publish ports from
  # internal networks). The vulnerable target is never attached to it.
  edge:
    name: sentinel-edge
  # The attack lab. INTERNAL: no route to the internet or to the host, so a mis-aimed tool cannot
  # leave it. Only target-shop, the responder gateway and the attack-tool containers join it.
  lab:
    name: lab
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  kafka-data:
  redis-data:
  pg-data:
  splunk-data:
  grafana-data:

services:
  target-shop:
    build: ./target-shop
    image: sentinel/target-shop:1.0.0
    profiles: ["core"]
    networks:
      backend: {}
      lab:
        ipv4_address: 172.30.0.11
    # No published port and no `edge` network: the shop has no internet egress and is reachable only
    # from the lab network (gateway and attack tools).
    environment:
      SHOP_VERSION: ${SHOP_VERSION:-v1}
      SHOP_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:-}
      SHOP_FILES_DIR: /app/data/files
      SHOP_KAFKA_ENABLED: "true"
      SHOP_KAFKA_BOOTSTRAP: kafka:9092
      SHOP_TRUSTED_PROXIES: 172.30.0.10   # the responder gateway
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,size=64m"]   # Kafka client unpacks a native lib here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
  responder:
    build: ./responder
    image: sentinel/responder:1.0.0
    profiles: ["core"]
    networks:
      backend: {}
      edge: {}
      lab:
        ipv4_address: 172.30.0.10   # trusted by target-shop for X-Forwarded-For
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      GATEWAY_UPSTREAM: http://172.30.0.11:8080
      GATEWAY_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-300}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_gw/health HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m

  kafka:
    image: apache/kafka:3.8.1
    profiles: ["core"]
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    networks: [backend, edge]
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    networks: [backend, edge]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  # ---- viz profile: start only when working on T13/T14 ----
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["viz"]
    networks: [backend, edge]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["viz"]
    networks: [backend, edge]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    mem_limit: 384m

  splunk:
    image: splunk/splunk:9.3
    profiles: ["viz"]
    networks: [backend, edge]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8088:8088"
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD in .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?set SPLUNK_HEC_TOKEN in .env}
    volumes:
      - splunk-data:/opt/splunk/var
    mem_limit: 3g
