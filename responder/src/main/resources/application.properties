spring.application.name=responder
server.port=8080
server.server-header=
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.max-swallow-size=2MB

gateway.upstream=${GATEWAY_UPSTREAM:http://172.30.0.11:8080}
gateway.jwt-secret=${GATEWAY_JWT_SECRET:}
gateway.rate-limit-per-minute=${GATEWAY_RATE_LIMIT:300}
gateway.fail-open=${GATEWAY_FAIL_OPEN:true}
gateway.redis.host=${GATEWAY_REDIS_HOST:redis}
gateway.redis.port=${GATEWAY_REDIS_PORT:6379}
gateway.redis.password=${GATEWAY_REDIS_PASSWORD:}
