spring.application.name=target-shop
server.port=8080
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=false

# Behaviour switch: v1 = intentionally vulnerable, v2 = fixed
shop.version=${SHOP_VERSION:v1}
shop.files-dir=${SHOP_FILES_DIR:./data/files}
shop.admin-password=${SHOP_ADMIN_PASSWORD:}
shop.trusted-proxies=${SHOP_TRUSTED_PROXIES:}
shop.kafka.enabled=${SHOP_KAFKA_ENABLED:false}
shop.kafka.bootstrap=${SHOP_KAFKA_BOOTSTRAP:kafka:9092}

# Servlet container: do not advertise a banner (v1 re-adds its own to be a finding)
server.server-header=
server.error.include-stacktrace=never
server.error.include-message=never
