name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,ml]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests (integration tests skip when Kafka/Redis/Postgres are not running)
        run: pytest -q --cov=sentinel --cov-report=term-missing --cov-report=xml
      - name: In-process evaluation (no Docker; logic metrics only)
        run: python -m sentinel.eval.evaluate --mode inproc --duration 20 --out /tmp/metrics.json
      - name: README results are generated, not hand-edited
        run: python scripts/update_readme_metrics.py --metrics results/metrics.json --check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: target-shop (v1 exploitable, v2 fixed)
        run: mvn -q -B -f target-shop/pom.xml test
      - name: responder gateway (blocklist, rate limit, JWT/RBAC, path-bypass attempts)
        run: mvn -q -B -f responder/pom.xml test
