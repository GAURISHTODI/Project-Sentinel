; Four saved searches over the events Sentinel forwards via HEC (sourcetypes sentinel:detection,
; sentinel:incident, sentinel:audit -- see src/sentinel/respond/splunk_forward.py). "Failed logins"
; is interpreted as login-related detections (SEN-001 brute-force, SEN-008 credential stuffing)
; since Sentinel forwards detections/incidents, not raw auth logs, to Splunk.

[Sentinel - Top attackers]
search = index=sentinel sourcetype=sentinel:detection src_ip=* \
    | stats count AS detections, dc(detector) AS distinct_rules, values(detector) AS rules BY src_ip \
    | sort -detections | head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = The 20 source IPs with the most Sentinel detections in the last 24 hours.

[Sentinel - Techniques over time]
search = index=sentinel sourcetype=sentinel:detection attack_id=* \
    | timechart span=1m count BY attack_id
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = Detection volume per MITRE ATT&CK technique ID over time.

[Sentinel - Failed logins]
search = index=sentinel sourcetype=sentinel:detection (detector="SEN-001" OR detector="SEN-008") \
    | stats count AS attempts, values(detector) AS rule, latest(explanation) AS last_seen_as BY src_ip, user \
    | sort -attempts
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = Brute-force (SEN-001) and credential-stuffing (SEN-008) detections, grouped by source and account.

[Sentinel - Blocked IPs]
search = index=sentinel sourcetype=sentinel:audit action="block_ip" detail.outcome="applied" \
    | stats count AS times_blocked, latest(detail.detector) AS blocked_by, latest(_time) AS last_blocked BY target \
    | rename target AS blocked_ip \
    | convert ctime(last_blocked) \
    | sort -last_blocked
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = IP addresses Sentinel's responder has actually blocked (from the audit log), not merely detected.
