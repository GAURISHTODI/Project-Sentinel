; Dedicated index for everything Sentinel forwards over HEC, kept separate from Splunk's own
; internal indexes (_internal, _audit, ...) and from "main" so retention/search can be scoped.
[sentinel]
homePath = $SPLUNK_DB/sentinel/db
coldPath = $SPLUNK_DB/sentinel/colddb
thawedPath = $SPLUNK_DB/sentinel/thaweddb
maxTotalDataSizeMB = 2048
