[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "AI-driven threat detection and automated response platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6,<7",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "confluent-kafka>=2.5,<3",
    "redis>=5,<6",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.20,<1",
    "pyjwt>=2.9,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# CPU-only PyTorch: pip install -e ".[ml]" --extra-index-url https://download.pytorch.org/whl/cpu
ml = [
    "xgboost>=2.1,<3",
    "torch>=2.4,<3",
    "mlflow>=2.15,<3",
    "sqlalchemy>=2.0,<2.1",  # mlflow 2.x breaks on SQLAlchemy 2.1
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML",
    "pandas-stubs",
    "fakeredis>=2.23,<3",
    "pre-commit>=3.8,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinel.detect.rules" = ["rules/*.yaml"]
"sentinel.respond" = ["policy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the docker compose core stack (Redis/Kafka/Postgres)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/sentinel/generator/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "sklearn.*", "xgboost.*", "mlflow.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Windows-only, optional at runtime (the exporter degrades gracefully without them); used only by
# windows/winpulse_exporter.py, which is outside the `files = ["src"]` scope `mypy src` checks.
module = ["pywintypes.*", "win32evtlog.*"]
ignore_missing_imports = true
